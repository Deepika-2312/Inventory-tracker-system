<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Store Billing Panel</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <header>
    <h1>Retail Store Billing Panel</h1>
  </header>

  <main>
    <!-- Customer Details -->
    <section class="customer-info">
      <h2>Customer Information</h2>
      <form>
        <label for="custName">Name:</label>
        <input type="text" id="custName" placeholder="Enter customer name">

        <label for="custPhone">Phone:</label>
        <input type="text" id="custPhone" placeholder="Enter phone number">
      </form>
    </section>

    <!-- Product Entry -->
    <section class="product-entry">
      <h2>Add Product</h2>
      <form id="productForm">
        <label for="productName">Product:</label>
        <input type="text" id="productName" placeholder="Enter product name">

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" value="1">

        <label for="price">Price (₹):</label>
        <input type="number" id="price" min="0" step="0.01">

        <button type="button" onclick="addProduct()">Add to Bill</button>
      </form>
    </section>

    <!-- Billing Table -->
    <section class="billing-table">
      <h2>Bill Details</h2>
      <table id="billTable">
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price (₹)</th>
            <th>Total (₹)</th>
          </tr>
        </thead>
        <tbody>
          <!-- Items will be added here dynamically -->
        </tbody>
      </table>
      <div class="total-section">
        <h3>Grand Total: ₹ <span id="grandTotal">0.00</span></h3>
      </div>
    </section>
  </main>

  <footer>
    <button onclick="printBill()">Print Bill</button>
  </footer>
</body>
</html>
